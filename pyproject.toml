[project]
name = "rey-del-truco-motor"
version = "0.1.0"
description = "Motor de truco argentino 1v1 con IA — juego + aprendizaje de ML por fases"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "torch>=2.13.0",
]

[project.scripts]
truco = "truco.ui.cli:cli"
truco-entrenar = "truco.rl.entrenar:main"
truco-entrenar-red = "truco.rl.entrenar_red:main"
truco-panel = "truco.rl.panel:main"
truco-scoreboard = "truco.scoreboard:main"
truco-autopsia = "truco.autopsia:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/truco"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle · I: imports · UP: pyupgrade · B: bugbear · SIM: simplify
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "numpy", "numpy.*"]
ignore_missing_imports = true
